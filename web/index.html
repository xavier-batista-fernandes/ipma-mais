<!doctype html>
<html lang="pt-PT">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="Mapa diário de evapotranspiração e temperatura por município, com dados do IPMA."
        />
        <title>IPMA+</title>
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <script>
            // Apply the saved theme and language before first paint (see src/settings.tsx).
            try {
                const saved = JSON.parse(localStorage.getItem('ipma-mais:settings') || '{}');
                if (saved.theme === 'light' || saved.theme === 'dark')
                    document.documentElement.dataset.theme = saved.theme;
                const lang = new URLSearchParams(location.search).get('lang') || saved.language;
                if (lang === 'pt' || lang === 'en')
                    document.documentElement.lang = lang === 'pt' ? 'pt-PT' : 'en';
            } catch {}
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
