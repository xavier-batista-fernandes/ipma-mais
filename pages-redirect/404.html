        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>IPMA+ has moved</title>
        <meta name="robots" content="noindex" />
        <link rel="canonical" href="https://ipma-mais.xavierbatistafernandes-001.workers.dev/" />
        <script>
            // GitHub Pages served the app under /ipma-mais/. Keep the rest of the address (the app's
            // ?m=…&d=…&c=… view, #/about, or an api/… path) so old links land on the same thing.
            (function () {
                var target = 'https://ipma-mais.xavierbatistafernandes-001.workers.dev';
                var path = location.pathname.replace(/^\/ipma-mais/, '') || '/';
                location.replace(target + path + location.search + location.hash);
            })();
        </script>
        <meta http-equiv="refresh" content="0; url=https://ipma-mais.xavierbatistafernandes-001.workers.dev/" />
    </head>
