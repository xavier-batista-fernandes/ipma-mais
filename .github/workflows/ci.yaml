name: CI

on:
    pull_request:
    push:
        branches: [main]
        paths-ignore:
            - 'data/**'

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: '24'
                  cache: npm

            - run: npm ci
            - run: npm test
            - name: Build the static API from data/
              run: npm run build:api
