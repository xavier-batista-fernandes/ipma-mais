name: Collect

on:
    workflow_dispatch:
    schedule:
        # Daily ET0 page, twice a day so a missed or late update is picked up the same day.
        - cron: '0 8 * * *'
        - cron: '0 20 * * *'

concurrency:
    group: collect
    cancel-in-progress: false

permissions:
    contents: write

jobs:
    collect:
        runs-on: ubuntu-latest
        steps:
            - name: 🧶 Checkout repository
              uses: actions/checkout@v5

            - name: 🧶 Set up Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: '24'
                  cache: npm

            - name: 🧶 Install dependencies
              run: npm ci

            - name: 🧶 Collect data
              run: npm run collect

            # Runs even when collection failed, so whatever did validate is kept.
            - name: 🧶 Commit changes
              if: ${{ !cancelled() }}
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

                  git add data/
                  if git diff --cached --quiet; then
                    echo "🟢 No changes to commit."
                  else
                    git commit -m "[auto] ⚙️ collect IPMA data"
                    git pull --rebase
                    git push
                  fi
