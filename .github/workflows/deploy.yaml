name: Redirect GitHub Pages

# The app now lives on Cloudflare (see cloudflare.yaml). GitHub Pages only serves pages-redirect/,
# which sends every old URL, including the app's view in the query string, to the same place there.

on:
    workflow_dispatch:
    push:
        branches: [main]
        paths:
            - 'pages-redirect/**'
            - '.github/workflows/deploy.yaml'

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - uses: actions/upload-pages-artifact@v4
              with:
                  path: pages-redirect

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4
