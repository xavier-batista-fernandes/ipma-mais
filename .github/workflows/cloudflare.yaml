name: Deploy to Cloudflare

# Publishes the app and the /v1 API on a Cloudflare Worker, with the data in D1. Runs alongside
# the GitHub Pages deploy until Pages is retired.

on:
    workflow_dispatch:
    push:
        branches: [main]
        paths:
            - 'web/**'
            - 'worker/**'
            - 'lib/**'
            - 'scripts/build-api.js'
            - 'scripts/sync-d1.js'
            - '.github/workflows/cloudflare.yaml'
    # Collect pushes with the default token, which doesn't trigger `push` workflows,
    # so sync whenever a collection run finishes to publish the new data.
    workflow_run:
        workflows: [Collect]
        types: [completed]

permissions:
    contents: read

concurrency:
    group: cloudflare
    cancel-in-progress: false

jobs:
    deploy:
        # A failed Collect can still have committed what did validate, so only skip cancelled runs.
        if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled'
        runs-on: ubuntu-latest
        env:
            CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
            CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        steps:
            - name: Check Cloudflare credentials
              id: check
              run: |
                  if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
                    echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set; skipping the Cloudflare deploy."
                    echo "skip=true" >> "$GITHUB_OUTPUT"
                  fi

            - uses: actions/checkout@v5
              if: steps.check.outputs.skip != 'true'
              with:
                  ref: main

            - uses: actions/setup-node@v5
              if: steps.check.outputs.skip != 'true'
              with:
                  node-version: '24'
                  cache: npm
                  cache-dependency-path: |
                      package-lock.json
                      web/package-lock.json
                      worker/package-lock.json

            - name: Install
              if: steps.check.outputs.skip != 'true'
              run: |
                  npm ci
                  npm ci --prefix web
                  npm ci --prefix worker

            # The D1 database is created on the first run and found by name afterwards, so its
            # id never has to be copied into the repository by hand.
            - name: Find or create the D1 database
              if: steps.check.outputs.skip != 'true'
              working-directory: worker
              run: |
                  find_id() { npx wrangler d1 list --json | jq -r '.[] | select(.name == "ipma-mais") | .uuid'; }
                  id="$(find_id)"
                  if [ -z "$id" ]; then
                    npx wrangler d1 create ipma-mais
                    # Newer Wrangler versions may offer to edit the config; keep ours as committed.
                    git checkout -- wrangler.jsonc
                    id="$(find_id)"
                  fi
                  test -n "$id"
                  sed -i "s/00000000-0000-0000-0000-000000000000/$id/" wrangler.jsonc
                  echo "D1 database: $id"

            - name: Apply D1 migrations
              if: steps.check.outputs.skip != 'true'
              working-directory: worker
              run: npx wrangler d1 migrations apply DB --remote

            - name: Sync data/ into D1 (changed days only)
              if: steps.check.outputs.skip != 'true'
              run: node scripts/sync-d1.js --remote

            - name: Build the web app against /v1
              if: steps.check.outputs.skip != 'true'
              working-directory: web
              env:
                  VITE_API_BASE: /v1
              run: npm run build

            - name: Deploy the Worker
              if: steps.check.outputs.skip != 'true'
              working-directory: worker
              run: npx wrangler deploy
